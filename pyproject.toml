[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "german-legal-rag"
version = "0.1.0"
description = "Local-first bilingual German legal retrieval augmented generation with evidence citations and reproducible evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "qdrant-client>=1.13,<3",
  "rank-bm25>=0.2.2,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0,<6"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
legal-rag = "legal_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
